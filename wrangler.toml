name = "recoreco"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# Variabile de mediu non-secret
[vars]
ALLOWED_COUNTRIES = "RO,MD,HU,BG,RS,MK,AL,BA,HR,SK,CZ,PL,UA"

# Secretele se setează cu:
#   wrangler pages secret put OFFER_URL
#   wrangler pages secret put STATE_SECRET
#
# OFFER_URL   = URL-ul afilierii Reco (ex: https://go.reco.example.com/offer/123?aff=456)
# STATE_SECRET = string random 32+ chars pentru HMAC-SHA256 (ex: openssl rand -hex 32)
